<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>판의 경계 시뮬레이터</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../jb-frame.css">
  <link rel="icon" href="../../logo.png" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <header class="jb-top">
    <a class="jb-top-brand" href="../../index.html" aria-label="J&amp;B LAB 허브">
      <img class="jb-top-logo" src="../../logo.png" alt="">
      <span class="jb-top-name">J&amp;B</span>
      <span class="jb-top-badge">LAB</span>
    </a>
    <span class="jb-top-divider" aria-hidden="true"></span>
    <span class="jb-top-page">지구과학 · 판의 경계 시뮬레이터</span>
    <a class="jb-top-home" href="../../index.html" aria-label="허브로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>허브로</a>
  </header>

  <section class="jb-banner jb-banner--earth">
    <div class="jb-banner-inner">
      <div class="jb-banner-copy">
        <p class="jb-banner-label">EARTH SCIENCE · 지구과학</p>
        <h1 class="jb-banner-title">판의 경계 시뮬레이터</h1>
        <p class="jb-banner-desc">발산형 · 보존형 · 수렴형 경계에서 판의 운동, 마그마 상승, 섭입, 지진 발생을 3D 지형 단면으로 관찰합니다.</p>
      </div>
    </div>
  </section>

  <main class="container">
    <section class="layout">
      <aside class="panel">
        <h2>설정</h2>

        <label>경계 유형
          <select id="boundaryType">
            <option value="divergent">발산형 경계 (해령)</option>
            <option value="transform">보존형 경계 (변환 단층)</option>
            <option value="convergent">수렴형 경계 (섭입대)</option>
          </select>
        </label>

        <label>판 이동 속도
          <input id="speed" type="range" min="0" max="100" value="45" />
        </label>

        <label>마그마 활동 세기
          <input id="magma" type="range" min="0" max="100" value="65" />
        </label>

        <label>지진 발생 빈도
          <input id="quake" type="range" min="0" max="100" value="45" />
        </label>

        <div class="check-list">
          <label><input id="showArrows" type="checkbox" checked /> 화살표 표시</label>
          <label><input id="showLabels" type="checkbox" checked /> 이름표 표시</label>
          <label><input id="showQuakes" type="checkbox" checked /> 지진 표시</label>
          <label><input id="showMagma" type="checkbox" checked /> 마그마 표시</label>
          <label><input id="showPlates" type="checkbox" checked /> 판(암석권) 경계선 표시</label>
          <label><input id="showMantle" type="checkbox" checked /> 맨틀 대류 표시</label>
          <label><input id="showBoundary" type="checkbox" /> 경계선 · 고지자기 줄무늬</label>
        </div>

        <div class="world-map-box">
          <div class="map-title">대표 위치</div>
          <img
            id="worldMapImg"
            class="world-map-img"
            src="https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg"
            alt="세계지도"
          />
          <div id="mapMarkers"></div>
        </div>

        <button id="captureBtn">이미지 저장</button>
      </aside>

      <section class="sim-area">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="simCanvas" width="1100" height="620"></canvas>
          <div id="labelLayer" class="label-layer"></div>
          <button id="fsBtn" class="fs-btn" type="button" aria-label="전체화면" title="전체화면 (Esc로 나가기)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>전체화면</span></button>
          <button id="fsPanelBtn" class="fs-btn fs-panel-btn" type="button" aria-label="설정 패널 숨기기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>설정 숨기기</span></button>
          <div class="sim-hint">드래그 회전 · 우클릭 드래그 이동 · Ctrl+스크롤 확대 · 더블클릭 초기화</div>
          <div id="legend" class="sim-legend"></div>
          <div id="loading" class="sim-loading">지형 생성 중…</div>
        </div>

        <div class="info-box">
          <h2 id="infoTitle">발산형 경계</h2>
          <p id="infoText">
            두 판이 서로 멀어지며, 맨틀 물질이 상승하여 새로운 해양 지각이 생성됩니다.
          </p>
        </div>

        <div class="example-box">
          <h3>대표 사례</h3>
          <div id="exampleList"></div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
