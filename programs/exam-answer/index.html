<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J&B LAB - 모의고사 답안 생성기</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Pretendard,"맑은 고딕",sans-serif;
}

body{
background:#eef2f7;
}

header{
height:70px;
background:#1f2937;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 40px;
color:white;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.brand{
font-size:28px;
font-weight:800;
}

.badge{
background:#2563eb;
padding:5px 10px;
border-radius:7px;
font-weight:bold;
}

.home{
color:white;
text-decoration:none;
background:#2563eb;
padding:10px 18px;
border-radius:8px;
}

.home:hover{
background:#1d4ed8;
}

.container{
max-width:1200px;
margin:35px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
margin-bottom:30px;
}

.inputTable{
border-collapse:collapse;
margin-bottom:25px;
}

.inputTable td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

.inputTable input{
width:60px;
font-size:18px;
padding:5px;
text-align:center;
}

button{
padding:11px 20px;
font-size:16px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
margin-right:10px;
margin-bottom:15px;
}

button:hover{
background:#1d4ed8;
}

#total{
font-size:20px;
font-weight:bold;
margin-bottom:25px;
}

.answerTable{
border-collapse:collapse;
margin-top:25px;
}

.answerTable td{
border:1px solid #555;
width:65px;
height:42px;
text-align:center;
font-size:20px;
}

.answerTable .num{
background:#f5f5f5;
font-weight:bold;
}

.summary{
margin-top:30px;
border-collapse:collapse;
}

.summary td{
border:1px solid #555;
width:80px;
height:40px;
text-align:center;
font-size:18px;
}

.copyBox{
margin-top:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

textarea{
width:100%;
height:150px;
margin-top:20px;
padding:15px;
font-size:15px;
}

@media print{

header,
button,
textarea,
.copyBox,
.inputTable{
display:none;
}

body{
background:white;
}

.container{
box-shadow:none;
padding:0;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
<div class="brand">J&B</div>
<div class="badge">LAB</div>
</div>

<a class="home" href="../">🏠 J&B 홈으로</a>

</header>

<div class="container">

<h1>모의고사 답안 생성기</h1>

<table class="inputTable">

<tr>
<td>①</td>
<td><input id="c1" type="number" value="5" min="0"></td>

<td>②</td>
<td><input id="c2" type="number" value="5" min="0"></td>

<td>③</td>
<td><input id="c3" type="number" value="5" min="0"></td>

<td>④</td>
<td><input id="c4" type="number" value="5" min="0"></td>

<td>⑤</td>
<td><input id="c5" type="number" value="5" min="0"></td>
</tr>

</table>

<div id="total">총 문항 : 25</div>

<button onclick="generate()">🎲 생성</button>

<button onclick="copyTable()">📋 표 복사</button>

<button onclick="copyExcel()">📄 엑셀 복사</button>

<button onclick="window.print()">🖨 인쇄</button>

<div id="result"></div>

<table class="summary" id="summary"></table>

<textarea id="excelText" readonly></textarea>

</div>

<script>

const circle=["①","②","③","④","⑤"];

["c1","c2","c3","c4","c5"].forEach(id=>{

document.getElementById(id).addEventListener("input",updateTotal);

});

updateTotal();

function updateTotal(){

let total=0;

for(let i=1;i<=5;i++)
total+=Number(document.getElementById("c"+i).value)||0;

document.getElementById("total").innerHTML="총 문항 : "+total;

}

function shuffle(arr){

for(let i=arr.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[arr[i],arr[j]]=[arr[j],arr[i]];

}

}

function generate(){

let answers=[];

for(let i=1;i<=5;i++){

let n=Number(document.getElementById("c"+i).value)||0;

for(let j=0;j<n;j++)
answers.push(i);

}

if(answers.length==0){

alert("문항 수를 입력하세요.");

return;

}

let ok=false;

while(!ok){

shuffle(answers);

ok=true;

for(let i=2;i<answers.length;i++){

if(
answers[i]==answers[i-1] &&
answers[i]==answers[i-2]
){

ok=false;
break;

}

}

}

draw(answers);

}

function draw(ans){

let html="<table class='answerTable'>";

let excel="";

let idx=0;

const perRow=5;

const rows=Math.ceil(ans.length/perRow);

for(let r=0;r<rows;r++){

html+="<tr>";

for(let c=0;c<perRow;c++){

if(idx<ans.length){

html+=`
<td class="num">${idx+1}</td>
<td>${circle[ans[idx]-1]}</td>
`;

excel+=(idx+1)+"\t"+circle[ans[idx]-1];

}else{

html+="<td></td><td></td>";

}

if(c<perRow-1) excel+="\t";

idx++;

}

excel+="\n";

html+="</tr>";

}

html+="</table>";

document.getElementById("result").innerHTML=html;

document.getElementById("excelText").value=excel;

let count=[0,0,0,0,0];

ans.forEach(v=>count[v-1]++);

document.getElementById("summary").innerHTML=`
<tr>
<td>①</td>
<td>②</td>
<td>③</td>
<td>④</td>
<td>⑤</td>
</tr>
<tr>
<td>${count[0]}</td>
<td>${count[1]}</td>
<td>${count[2]}</td>
<td>${count[3]}</td>
<td>${count[4]}</td>
</tr>
`;

}

function copyExcel(){

navigator.clipboard.writeText(
document.getElementById("excelText").value
);

alert("엑셀용 데이터가 복사되었습니다.");

}

function copyTable(){

const table=document.querySelector(".answerTable");

if(!table){

alert("먼저 생성하세요.");

return;

}

const range=document.createRange();

range.selectNode(table);

const sel=window.getSelection();

sel.removeAllRanges();

sel.addRange(range);

document.execCommand("copy");

sel.removeAllRanges();

alert("표가 복사되었습니다.");

}

generate();

</script>

</body>
</html>
