<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>평가원 문제 검색</title>

<link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../jb-frame.css">

</head>
<body>

<header class="jb-top">
    <a class="jb-top-brand" href="../../index.html" aria-label="J&amp;B LAB 허브">
      <img class="jb-top-logo" src="../../logo.png" alt="">
      <span class="jb-top-name">J&amp;B</span>
      <span class="jb-top-badge">LAB</span>
    </a>
    <span class="jb-top-divider" aria-hidden="true"></span>
    <span class="jb-top-page">프로그램 · 문항 출처 검색기</span>
    <a class="jb-top-home" href="../../index.html" aria-label="허브로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>허브로</a>
  </header>

  <section class="jb-banner jb-banner--program">
    <div class="jb-banner-inner">
      <div class="jb-banner-copy">
        <p class="jb-banner-label">PROGRAM · 프로그램</p>
        <h1 class="jb-banner-title">기출 문제 검색</h1>
        <p class="jb-banner-desc">시험 연월 · 학년 · 과목 · 번호로 기출 문항과 문제 · 해설 PDF를 찾습니다.</p>
      </div>
    </div>
  </section>

<main>

  <section class="search-card">
    <p class="guide">
      예시 :
      25 03 고2 지구과학Ⅰ 12번<br>
      25 10 고3 물리학Ⅰ 7번<br>
      26 수능 화학Ⅰ 15번
    </p>

    <div class="search-row">
      <input
        id="searchInput"
        type="text"
        placeholder="검색어 입력"
        autocomplete="off"
      >

      <button id="searchBtn">
        검색
      </button>
    </div>

    <div id="searchInfo"></div>

  </section>


  <section id="resultArea" class="hidden">

    <div class="result-card">

      <h2 id="resultTitle">
        검색 결과
      </h2>

      <div class="image-wrap">

        <img
          id="questionImage"
          src=""
          alt=""
        >

      </div>

      <div class="button-wrap">

        <a
          id="problemPdfBtn"
          target="_blank"
          class="pdf-btn"
        >
          문제 PDF
        </a>

        <a
          id="solutionPdfBtn"
          target="_blank"
          class="pdf-btn"
        >
          해설 PDF
        </a>

      </div>

    </div>

  </section>

</main>

<script src="app.js?v=2"></script>

</body>
</html>
