<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J&B 문항 형식 체크리스트</title>
  <style>
    :root{
      --navy:#09243b;
      --blue:#176aa6;
      --yellow:#f4c447;
      --paper:#f5f2eb;
      --white:#fff;
      --ink:#172534;
      --muted:#71808d;
      --line:#dce3e8;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
    }
    button,input{font:inherit}

    header{
      height:66px;
      padding:0 max(20px,5vw);
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#fff;
      border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:13px;color:var(--navy)}
    .logo{font:900 27px Georgia,serif;letter-spacing:-2px}
    .logo i{font-style:normal;color:var(--yellow);font-size:20px}
    .brand-name{
      padding-left:13px;
      border-left:1px solid var(--line);
      font-size:13px;
      font-weight:800;
    }
    .reset{
      padding:8px 14px;
      border:1px solid var(--line);
      border-radius:30px;
      background:#fff;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }
    .reset:hover{border-color:var(--navy);color:var(--navy)}
    .header-actions{display:flex;align-items:center;gap:8px}
    .home{
      padding:8px 14px;
      border:1px solid var(--navy);
      border-radius:30px;
      background:var(--navy);
      color:#fff;
      font-size:12px;
      font-weight:800;
      text-decoration:none;
    }
    .home:hover{background:var(--blue);border-color:var(--blue)}

    .hero{
      padding:45px 20px 42px;
      background:var(--navy);
      color:#fff;
    }
    .hero-inner{max-width:780px;margin:auto}
    .eyebrow{
      margin:0 0 12px;
      color:var(--yellow);
      font:800 10px Arial,sans-serif;
      letter-spacing:.18em;
    }
    h1{
      margin:0;
      font-size:clamp(35px,7vw,54px);
      line-height:1.1;
      letter-spacing:-.055em;
    }
    h1 em{color:var(--yellow);font-style:normal}
    .hero-bottom{
      margin-top:27px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:15px;
      align-items:center;
    }
    .track{
      height:7px;
      overflow:hidden;
      border-radius:10px;
      background:rgba(255,255,255,.14);
    }
    .bar{width:0;height:100%;background:var(--yellow);transition:width .25s}
    .score{min-width:70px;text-align:right;color:var(--yellow);font-size:22px;font-weight:850}
    .hero-note{grid-column:1/-1;margin:0;color:#91a5b5;font-size:11px}

    main{max-width:780px;margin:auto;padding:26px 16px 70px}
    .checklist{
      overflow:hidden;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 8px 28px rgba(18,40,59,.06);
    }
    .item{
      display:grid;
      grid-template-columns:36px 28px 1fr;
      gap:11px;
      align-items:center;
      min-height:82px;
      padding:13px 22px;
      border-bottom:1px solid #edf1f3;
      cursor:pointer;
      transition:.15s;
    }
    .item:last-child{border-bottom:0}
    .item:hover{background:#fafcfd}
    .item input{position:absolute;opacity:0;pointer-events:none}
    .number{color:#9aa7b2;font:800 10px Arial,sans-serif}
    .box{
      width:24px;
      height:24px;
      display:grid;
      place-items:center;
      border:1.5px solid #aab8c3;
      color:transparent;
      font-size:12px;
      transition:.15s;
    }
    .copy strong{
      display:block;
      color:var(--navy);
      font-size:14px;
      line-height:1.45;
    }
    .copy span{
      display:block;
      margin-top:5px;
      color:var(--muted);
      font-size:11.5px;
      line-height:1.45;
    }
    .item.done{background:#f8fafb}
    .item.done .box{background:var(--blue);border-color:var(--blue);color:#fff}
    .item.done .copy strong{color:#82909b;text-decoration:line-through}
    .item.done .copy span{color:#a2adb5}

    .complete{
      display:none;
      margin-top:16px;
      padding:17px 20px;
      background:#fff7d7;
      border-left:5px solid var(--yellow);
      color:#5e5538;
      font-size:13px;
      font-weight:700;
    }
    .complete.show{display:block}

    footer{
      padding:25px 20px;
      border-top:1px solid var(--line);
      background:#fff;
      color:#8a98a3;
      text-align:center;
      font-size:11px;
    }

    @media(max-width:520px){
      .brand-name{display:none}
      .hero{padding-top:38px}
      .item{grid-template-columns:25px 26px 1fr;padding:13px 15px;gap:9px}
      .copy strong{font-size:13px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">J<i>&</i>B</span>
      <span class="brand-name">문항 형식 체크</span>
    </div>
    <div class="header-actions">
      <button class="reset" id="reset">초기화</button>
      <a class="home" href="../../index.html">J&amp;B 홈</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow">FINAL FORMAT CHECK · 10</p>
      <h1>내용 말고,<br><em>형식만 확인.</em></h1>
      <div class="hero-bottom">
        <div class="track"><div class="bar" id="bar"></div></div>
        <div class="score"><span id="done">0</span> / 10</div>
        <p class="hero-note">체크 기록은 이 브라우저에 자동 저장됩니다.</p>
      </div>
    </div>
  </section>

  <main>
    <section class="checklist" id="checklist">
      <label class="item">
        <span class="number">01</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>기호가 문제 전체에서 동일한가?</strong>
          <span>본문·그림·표·보기의 A/B, H/h, P/p, t₁/t₂ 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">02</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>그림·표의 구분 표시가 정확한가?</strong>
          <span>(가), (나), Ⅰ, Ⅱ의 누락·중복·순서 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">03</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>지시선·화살표·기호의 위치가 정확한가?</strong>
          <span>해당 물체·지점·구간을 정확히 가리키는지 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">04</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>그래프의 기본 요소가 모두 있는가?</strong>
          <span>원점 0, 축 이름, 단위, 눈금, 범례, 필요한 점선 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">05</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>수치·기호·단위의 간격이 통일되었는가?</strong>
          <span>2 초, 30 m/s, 힘 F, 2v, t₁ 등의 띄어쓰기 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">06</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>첨자·대소문자·수식 기호가 정확한가?</strong>
          <span>m/s², Cu²⁺, t₁, P/p, ×/·, 등호 앞뒤 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">07</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>문장부호와 괄호 형식이 맞는가?</strong>
          <span>실험 Ⅰ: A, A, B, 문장 끝 온점, 괄호 안쪽 공백 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">08</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>보기와 선택지의 정렬·간격이 일정한가?</strong>
          <span>ㄱ·ㄴ·ㄷ 들여쓰기, 두 번째 줄 정렬, ㄱ, ㄴ, ①~⑤ 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">09</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>문항 구성 요소가 정해진 위치에 있는가?</strong>
          <span>배점, 그림·표 출처, 보기 상자, 그림과 발문 사이 간격 확인</span>
        </span>
      </label>

      <label class="item">
        <span class="number">10</span><input type="checkbox"><span class="box">✓</span>
        <span class="copy">
          <strong>제목·문단·수식 배치가 정돈되었는가?</strong>
          <span>[문제 분석]·[정답 풀이]·[오답 풀이], 줄바꿈, 계산식·단위 확인</span>
        </span>
      </label>
    </section>

    <div class="complete" id="complete">10개 항목을 모두 확인했습니다.</div>
  </main>

  <footer>J&B QUESTION FORMAT CHECK</footer>

  <script>
    const KEY = "jb-format-checklist-v4";
    const boxes = [...document.querySelectorAll(".item input")];
    let saved = [];

    try {
      saved = JSON.parse(localStorage.getItem(KEY) || "[]");
    } catch (e) {}

    boxes.forEach((box, index) => {
      box.checked = Boolean(saved[index]);
      box.closest(".item").classList.toggle("done", box.checked);

      box.addEventListener("change", () => {
        box.closest(".item").classList.toggle("done", box.checked);
        localStorage.setItem(KEY, JSON.stringify(boxes.map(item => item.checked)));
        update();
      });
    });

    function update() {
      const count = boxes.filter(box => box.checked).length;
      document.getElementById("done").textContent = count;
      document.getElementById("bar").style.width = `${count * 10}%`;
      document.getElementById("complete").classList.toggle("show", count === 10);
    }

    document.getElementById("reset").addEventListener("click", () => {
      if (!confirm("체크 기록을 모두 초기화할까요?")) return;
      boxes.forEach(box => {
        box.checked = false;
        box.closest(".item").classList.remove("done");
      });
      localStorage.removeItem(KEY);
      update();
    });

    update();
  </script>
</body>
</html>
