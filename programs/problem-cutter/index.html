<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>문제 추출기 | J&B LAB</title>

<link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../jb-frame.css">
</head>

<body>

<header class="jb-top">
    <a class="jb-top-brand" href="../../index.html" aria-label="J&amp;B LAB 허브">
      <img class="jb-top-logo" src="../../logo.png" alt="">
      <span class="jb-top-name">J&amp;B</span>
      <span class="jb-top-badge">LAB</span>
    </a>
    <span class="jb-top-divider" aria-hidden="true"></span>
    <span class="jb-top-page">프로그램 · 문제 추출기</span>
    <a class="jb-top-home" href="../../index.html" aria-label="허브로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>허브로</a>
  </header>

  <section class="jb-banner jb-banner--program">
    <div class="jb-banner-inner">
      <div class="jb-banner-copy">
        <p class="jb-banner-label">PROGRAM · 프로그램</p>
        <h1 class="jb-banner-title">문제 추출기</h1>
        <p class="jb-banner-desc">PDF를 업로드하면 페이지를 이미지로 변환한 뒤, 좌우 2단 구조 기준으로 문항 이미지를 잘라 ZIP으로 저장합니다.</p>
      </div>
    </div>
  </section>

<main class="app">
  <section class="panel">
    <input id="pdfInput" type="file" accept="application/pdf" multiple>

    <div class="options">
      <label>
        시작 문항
        <input id="startNum" type="number" value="1" min="1">
      </label>

      <label>
        끝 문항
        <input id="endNum" type="number" value="25" min="1">
      </label>

      <label>
        렌더 배율
        <input id="scaleInput" type="number" value="2.5" step="0.5" min="1">
      </label>
    </div>

    <button id="runBtn">문항 추출하기</button>

    <div id="status">대기 중</div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>

</body>
</html>
