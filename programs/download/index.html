<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070a12" />
  <meta name="description" content="J&B LAB에서 제작한 프로그램을 내려받는 페이지입니다." />
  <title>J&B LAB | DOWNLOAD</title>
  <style>
    :root {
      --bg: #070a12;
      --panel: rgba(15, 20, 34, .72);
      --line: rgba(159, 181, 255, .13);
      --text: #f4f7ff;
      --muted: #909bb5;
      --cyan: #45e7ff;
      --violet: #946bff;
      --shadow: 0 24px 70px rgba(0, 0, 0, .38);
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(70, 217, 255, .10), transparent 28rem),
        radial-gradient(circle at 85% 18%, rgba(132, 84, 255, .13), transparent 30rem),
        linear-gradient(150deg, #080b14 0%, #060812 55%, #0a0714 100%);
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .24;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }

    .shell {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .13em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      aspect-ratio: 1;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      color: #071018;
      box-shadow: 0 0 28px rgba(69, 231, 255, .24);
      letter-spacing: -.06em;
      font-size: 13px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status::before {
      content: "";
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #44e8a8;
      box-shadow: 0 0 12px #44e8a8;
    }

    .hero {
      padding: 110px 0 72px;
      max-width: 760px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 850;
    }

    h1 span {
      display: block;
      margin-top: 10px;
      color: transparent;
      background: linear-gradient(95deg, #e8f9ff 5%, var(--cyan) 42%, #bca8ff 90%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .hero p {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.8;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 20px;
    }

    .section-head h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .section-head span { color: var(--muted); font-size: 12px; }

    .program-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .program-card {
      position: relative;
      min-height: 238px;
      display: flex;
      flex-direction: column;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(19, 25, 43, .84), rgba(10, 13, 24, .68));
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }

    .program-card::after {
      content: "";
      position: absolute;
      inset: auto -40px -80px auto;
      width: 170px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow), transparent 68%);
      opacity: .18;
      transition: opacity .25s ease, transform .25s ease;
    }

    .program-card:hover, .program-card:focus-visible {
      transform: translateY(-6px);
      border-color: rgba(108, 220, 255, .42);
      background: linear-gradient(145deg, rgba(23, 32, 54, .94), rgba(12, 15, 29, .82));
      outline: none;
    }

    .program-card:hover::after { opacity: .34; transform: scale(1.12); }

    .card-top { display: flex; align-items: center; justify-content: space-between; }

    .icon {
      display: grid;
      place-items: center;
      width: 48px;
      aspect-ratio: 1;
      border-radius: 15px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 22px;
    }

    .arrow {
      color: #c9d3e8;
      font-size: 18px;
      transform: rotate(-45deg);
      transition: transform .25s ease, color .25s ease;
    }

    .program-card:hover .arrow { transform: rotate(0) translateX(2px); color: var(--cyan); }

    .card-copy { margin-top: auto; position: relative; z-index: 1; }
    .card-copy h3 { margin: 0 0 9px; font-size: 18px; letter-spacing: -.03em; }
    .card-copy p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .download-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 18px;
      color: #d8e4f8;
      font-size: 12px;
      font-weight: 700;
    }

    .download-label::before { content: "↓"; color: var(--cyan); }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 34px;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,.07);
      color: #68738b;
      font-size: 11px;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 560px); padding-top: 22px; }
      .status { display: none; }
      .hero { padding: 80px 0 54px; }
      .program-grid { grid-template-columns: 1fr; }
      .program-card { min-height: 210px; }
      footer { flex-direction: column; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark">J&B</span> J&amp;B LAB</div>
      <div class="status">DOWNLOAD CENTER</div>
    </header>

    <section class="hero">
      <div class="eyebrow">TOOLS FOR BETTER WORK</div>
      <h1>생산성 도구를 활용하여,<span>업무 효율을 높이세요.</span></h1>
      <p>J&amp;B LAB에서 제작한 업무 도구입니다.<br />필요한 프로그램을 선택하면 바로 다운로드됩니다.</p>
    </section>

    <section aria-labelledby="program-title">
      <div class="section-head">
        <h2 id="program-title">PROGRAMS</h2>
        <span id="program-count"></span>
      </div>
      <div class="program-grid" id="program-list"></div>
    </section>

    <footer>
      <span>© 2026 J&amp;B LAB. ALL RIGHTS RESERVED.</span>
      <span>WINDOWS APPLICATIONS</span>
    </footer>
  </main>

  <script>
    // 새 링크 추가 방법: 아래에 한 줄을 복사한 뒤 이름, Drive ID, 설명, 아이콘만 바꾸세요.
    const programs = [
      ["문항추출기.exe", "1E6znAw2NDSc8yp4vcoKTtrFpg2YE09UX", "문항 자료를 빠르게 추출하고 정리합니다.", "✦"],
      ["PDFSideCompare.exe", "1L7-Jn6V826QIxPeilkG3UHC5eh2XN-2s", "두 PDF를 나란히 놓고 편리하게 비교합니다.", "◫"],
      ["이미지 압축기.exe", "1m_QrxJrjc0RUDQi9WnWcSpanlfENtgdH", "이미지 품질을 유지하며 파일 용량을 줄입니다.", "◇"],
      // ["새 프로그램.exe", "구글_드라이브_파일_ID", "프로그램 설명", "＋"],
    ];

    const colors = ["rgba(69,231,255,.95)", "rgba(148,107,255,.95)", "rgba(81,239,177,.95)", "rgba(255,115,178,.95)"];
    const list = document.querySelector("#program-list");

    list.innerHTML = programs.map(([name, driveId, description, icon], index) => `
      <a class="program-card"
         style="--glow:${colors[index % colors.length]}"
         href="https://drive.google.com/uc?export=download&id=${encodeURIComponent(driveId)}"
         aria-label="${name} 다운로드">
        <div class="card-top">
          <span class="icon" aria-hidden="true">${icon}</span>
          <span class="arrow" aria-hidden="true">→</span>
        </div>
        <div class="card-copy">
          <h3>${name}</h3>
          <p>${description}</p>
          <span class="download-label">DOWNLOAD</span>
        </div>
      </a>
    `).join("");

    document.querySelector("#program-count").textContent = `${programs.length} PROGRAMS AVAILABLE`;
  </script>
</body>
</html>
